<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickOrder - Catálogo de Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">QuickOrder</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">Catálogo</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Catálogo de Productos</h2>
      <button class="btn btn-outline-primary" onclick="cargarProductos()">Actualizar</button>
    </div>

    <!-- Vista de Tarjetas (Cards) -->
    <div class="row id-cards-container mb-4" id="cards-container">
      <!-- Carga dinámica vía JS -->
    </div>

    <!-- Vista de Tabla -->
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="card-title mb-0">Listado Completo</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Vendidos</th>
              </tr>
            </thead>
            <tbody id="tabla-productos">
              <!-- Carga dinámica vía JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
