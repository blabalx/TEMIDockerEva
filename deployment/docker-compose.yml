

networks:
  acceso:
    name: red_acceso
    driver: bridge
  aplicacion:
    name: red_aplicacion
    driver: bridge
  datos:
    name: red_datos
    driver: bridge

volumes:
  mysql_data:
    name: vol_mysql_data

services:
  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - acceso
      - aplicacion
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    image: josi542/quickorder-frontend:latest
    container_name: frontend
    networks:
      - acceso
    restart: unless-stopped

  backend:
    image: blabalel/quickorder-backend:v1
    container_name: backend
    networks:
      - aplicacion
      - datos
    environment:
      - DB_HOST=db
      - DB_USER=quickuser
      - DB_PASSWORD=quickpass
      - DB_NAME=quickorder
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: db
    networks:
      - datos
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=quickorder
      - MYSQL_USER=quickuser
      - MYSQL_PASSWORD=quickpass
    restart: unless-stopped